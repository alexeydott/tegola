version: "2"

run:
  timeout: 5m
  # legacy tests rely on unkeyed struct literals and lock-copying helpers;
  # linting them is tracked as follow-up debt
  tests: false

linters:
  # correctness-oriented set; keep conservative to stay meaningful on legacy code
  default: none
  enable:
  - govet
  - errcheck
  - staticcheck
  settings:
    staticcheck:
      checks:
      - all
      # ST* are style-only churn on legacy code;
      # QF* are editor quickfix suggestions, not correctness checks
      - -ST*
      - -QF*
      # SA1019 (deprecated API usage: github.com/golang/protobuf, io/ioutil)
      # is a cross-cutting migration tracked separately
      - -SA1019
    errcheck:
      # deferred Close on read-only paths is an accepted legacy pattern;
      # new code should check Close explicitly
      exclude-functions:
      - (io.Closer).Close
  exclusions:
    paths:
    # vendored Go helper inside the npm package, not part of the module builds
    - ui/node_modules/
