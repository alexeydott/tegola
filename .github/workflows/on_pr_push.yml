name: On push
on: [push, pull_request]

jobs:
  test:
    name: Test on Ubuntu (cgo=${{ matrix.cgo }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        cgo: ['1', '0']

    steps:
    - name: Check out code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: 'go.mod'
        check-latest: true

    - name: Env Debug
      run: |
        go env
        pwd
        echo ${HOME}
        echo ${GITHUB_WORKSPACE}

    - name: Setup test environment
      run: docker compose up -d

    - name: Postgres Debug
      env:
        PGUSER: postgres
        PGHOST: localhost
        PGDATABASE: postgres
        PGPASSWORD: postgres
      run: |
        psql -c "\l"

    - name: Run tests
      env:
        CGO_ENABLED: ${{ matrix.cgo }}

        # redis tests
        RUN_REDIS_TESTS: yes

        # AWS S3 tests: only run when AWS credentials are configured as repo secrets.
        # A public S3 bucket must not be assumed; without secrets these tests skip.
        RUN_S3_TESTS: ${{ secrets.AWS_ACCESS_KEY_ID != '' && 'yes' || '' }}
        AWS_TEST_BUCKET: ${{ secrets.AWS_TEST_BUCKET }}
        AWS_REGION: ${{ secrets.AWS_REGION }}
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

        # PostGIS tests (services are started via docker compose)
        RUN_POSTGIS_TESTS: yes
        PGURI: postgres://postgres:postgres@localhost:5432/tegola
        PGURI_NO_ACCESS: postgres://postgres:postgres@localhost:5432/tegola
        PGSSLMODE: disable
        PGSSLKEY: ""
        PGSSLCERT: ""
        PGSSLROOTCERT: ""

        # HANA tests: only run when the connection string is provided as a repo secret.
        # The credentials were hardcoded in upstream CI (go-spatial/tegola#893) and must
        # be rotated; they are never stored in this repository.
        RUN_HANA_TESTS: ${{ secrets.HANA_CONNECTION_STRING != '' && 'yes' || '' }}
        HANA_CONNECTION_STRING: ${{ secrets.HANA_CONNECTION_STRING }}
      run: |
        go test -mod vendor -covermode atomic -coverprofile=profile.cov ./...

    - name: Send coverage report to Coveralls
      env:
        COVERALLS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        go install github.com/mattn/goveralls@v0.0.5
        $(go env GOPATH)/bin/goveralls -coverprofile=profile.cov -service=github

    - name: Build embedded UI
      run: |
        pushd ${GITHUB_WORKSPACE}/server
        go generate ./...
        popd

    - name: Tear down test environment
      run: docker compose down

  lint:
    name: Lint (gofmt + golangci-lint)
    runs-on: ubuntu-22.04
    steps:
    - name: Check out code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: 'go.mod'
        check-latest: true

    - name: gofmt check
      run: |
        unformatted=$(gofmt -s -l . | grep -v '^vendor/' || true)
        if [ -n "$unformatted" ]; then
          echo "Unformatted files:"
          echo "$unformatted"
          exit 1
        fi

    - name: golangci-lint
      run: go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.2 run ./...

  govulncheck:
    name: Run govulncheck
    runs-on: ubuntu-22.04
    steps:
    - name: Check out code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: 'go.mod'
        check-latest: true

    - name: Install and run go vulncheck
      run: |
        go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
        govulncheck ./...